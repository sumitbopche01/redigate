<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img">
  <title>Animation of a cache miss followed by a cache hit</title>
  <desc>A short loop. First RediGate calls the model and stores the answer. Then the same request is answered from Redis and the model is not called. If animation is disabled, the miss is what you see.</desc>
  <rect width="720" height="320" fill="#f4f0e8"/>
  <text x="28" y="42" fill="#1f1a17" font-family="Georgia, Palatino, serif" font-size="22">Miss, then hit</text>
  <text x="28" y="68" fill="#5c564e" font-family="Georgia, Palatino, serif" font-size="14">Loops every few seconds. A still frame shows the miss.</text>

  <rect x="36" y="104" width="120" height="52" rx="12" fill="#e7f2f0" stroke="#1f4e4a"/>
  <text x="96" y="135" text-anchor="middle" fill="#1f4e4a" font-family="Georgia, Palatino, serif" font-size="16">Your app</text>
  <rect x="196" y="104" width="128" height="52" rx="12" fill="#1f4e4a"/>
  <text x="260" y="135" text-anchor="middle" fill="#fffdf8" font-family="Georgia, Palatino, serif" font-size="16">RediGate</text>
  <rect x="364" y="104" width="120" height="52" rx="12" fill="#fffdf8" stroke="#b4332a"/>
  <text x="424" y="135" text-anchor="middle" fill="#b4332a" font-family="Georgia, Palatino, serif" font-size="16">Redis</text>
  <line x1="156" y1="130" x2="190" y2="130" stroke="#1f1a17" stroke-width="1.6" marker-end="url(#ink)"/>

  <g>
    <line x1="324" y1="122" x2="358" y2="122" stroke="#b4332a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#redis)"/>
    <text x="341" y="98" text-anchor="middle" fill="#9a5b12" font-family="Georgia, Palatino, serif" font-size="13">empty</text>
    <rect x="196" y="196" width="128" height="52" rx="12" fill="#314155"/>
    <text x="260" y="227" text-anchor="middle" fill="#fffdf8" font-family="Georgia, Palatino, serif" font-size="16">Model</text>
    <line x1="260" y1="156" x2="260" y2="190" stroke="#1f1a17" stroke-width="1.6" marker-end="url(#ink)"/>
    <path d="M324 222 H400 V156" fill="none" stroke="#b4332a" stroke-width="1.6" marker-end="url(#redis)"/>
    <text x="332" y="214" fill="#b4332a" font-family="Georgia, Palatino, serif" font-size="13">save</text>
    <text x="36" y="286" fill="#9a5b12" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">X-RediGate-Cache: MISS</text>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.42;0.5;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="324" y1="130" x2="358" y2="130" stroke="#1d6b45" stroke-width="1.8" marker-end="url(#hit)"/>
    <path d="M424 156 V188 H300 V162" fill="none" stroke="#1d6b45" stroke-width="1.6" marker-end="url(#hit)"/>
    <text x="318" y="180" fill="#1d6b45" font-family="Georgia, Palatino, serif" font-size="13">saved answer</text>
    <rect x="196" y="220" width="128" height="44" rx="12" fill="#f4f0e8" stroke="#c9c0b4" stroke-dasharray="5 4"/>
    <text x="260" y="247" text-anchor="middle" fill="#8a8178" font-family="Georgia, Palatino, serif" font-size="14">Model not called</text>
    <text x="36" y="286" fill="#1d6b45" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">X-RediGate-Cache: HIT</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.5;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1a17"/>
    </marker>
    <marker id="redis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4332a"/>
    </marker>
    <marker id="hit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6b45"/>
    </marker>
  </defs>
</svg>
